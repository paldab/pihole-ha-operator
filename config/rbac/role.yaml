---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pihole.paldab.nl
  resources:
  - piholeclusters
  - piholeconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pihole.paldab.nl
  resources:
  - piholeclusters/finalizers
  - piholeconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - pihole.paldab.nl
  resources:
  - piholeclusters/status
  - piholeconfigs/status
  verbs:
  - get
  - patch
  - update
