# This rule is not used by the project pihole-ha-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the pihole.paldab.nl.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pihole-ha-operator
    app.kubernetes.io/managed-by: kustomize
  name: piholecluster-editor-role
rules:
- apiGroups:
  - pihole.paldab.nl
  resources:
  - piholeclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pihole.paldab.nl
  resources:
  - piholeclusters/status
  verbs:
  - get
