name: Build and push images test

on:
  push:
    tags:
      - "test*.*.*" # semver

jobs:
  push_to_registry:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: make docker-build-all \
          VERSION=${{ github.ref_name }} \
          GIT_COMMIT=${{ github.sha }}

      - name: Lint Helm chart
        run: |
          helm lint ./charts/pihole-ha-operator

      - name: Package Helm chart
        shell: bash
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          CHART_VERSION="${RELEASE_TAG#test}"

          mkdir -p dist

          helm package ./charts/pihole-ha-operator \
            --destination dist \
            --version "${CHART_VERSION}" \
            --app-version "${RELEASE_TAG}"

      - name: Inspect packaged chart
        shell: bash
        run: |
          CHART_VERSION="${GITHUB_REF_NAME#test}"

          helm show chart \
            "dist/pihole-ha-operator-${CHART_VERSION}.tgz"

      - name: Checkout Helm repository
        uses: actions/checkout@v6
        with:
          repository: paldab/helm-charts
          token: ${{ secrets.HELM_REPO_TOKEN }}
          ref: gh-pages
          path: helm-repo

      - name: push docker image
        run: make docker-push-all \
          VERSION=${{ github.ref_name }} \
          GIT_COMMIT=${{ github.sha }}

      - name: Publish Helm chart
        shell: bash
        run: |
          CHART_VERSION="${GITHUB_REF_NAME#test}"
          CHART="pihole-ha-operator-${CHART_VERSION}.tgz"

          cp "dist/${CHART}" helm-repo/

          cd helm-repo

          helm repo index . \
            --merge index.yaml \
            --url https://paldab.github.io/helm-charts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${CHART}" index.yaml
          git commit -m "Release pihole-ha-operator ${CHART_VERSION}"
          git push
